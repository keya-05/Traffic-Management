<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Intelligence - Dark Mode</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">TRAFFIC<span class="hub">HUB</span></div>
            <nav>
                <div class="nav-item active"><i class="fas fa-chart-line"></i> Dashboard</div>
                <div class="nav-item"><i class="fas fa-file-invoice-dollar"></i> Fines</div>
                <div class="nav-item"><i class="fas fa-cogs"></i> Settings</div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>Traffic Intelligence <span class="badge">Live</span></h2>
                <button id="refreshDataBtn" class="refresh-btn">Sync Data</button>
            </header>

            <div class="grid-layout">
                <div class="card form-card">
                    <h3><i class="fas fa-plus-circle"></i> New Entry</h3>
                    <input type="text" id="vehicleId" placeholder="Vehicle ID">
                    <input type="number" id="speed" placeholder="Speed (km/h)">
                    <input type="text" id="zone" placeholder="Zone">
                    <label class="checkbox-group">
                        <input type="checkbox" id="emergencyBox">
                        <span>Emergency Vehicle</span>
                    </label>
                    <button id="processBtn">Process Event</button>
                    <div id="outputArea" style="margin-top:10px; font-size:0.8rem; text-align:center;"></div>
                </div>

                <div class="card charts-container">
                    <div class="chart-wrapper">
                        <canvas id="fineChart"></canvas>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>

                <div class="card status-feed-card">
                    <h3><i class="fas fa-list-ul"></i> Recent System Activity (Top 5)</h3>
                    <table class="status-table">
                        <thead>
                        <tr>
                            <th>Vehicle</th>
                            <th>Zone</th>
                            <th>Speed</th>
                            <th>Fine</th>
                        </tr>
                        </thead>
                        <tbody id="activityLog">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
